services:
  - type: web
    name: mini-erp-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

databases:
  - name: mini-erp-db
    databaseName: minierpcrm
    user: minierpuser
